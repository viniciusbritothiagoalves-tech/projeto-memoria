<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Leads</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #F4EFE6;
            color: #4A3C31;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h2 {
            margin-top: 0;
            color: #4A3C31;
        }
        .alert {
            background-color: #FFF3CD;
            color: #856404;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #FFEEBA;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }
        .btn {
            background-color: #A88F78;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #967E67;
        }
        .btn-danger {
            background-color: #D32F2F;
        }
        .btn-danger:hover {
            background-color: #B71C1C;
        }
        .table-responsive {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #FFF;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 15px;
            border-bottom: 1px solid #E2D7C8;
            text-align: left;
        }
        th {
            background-color: #A88F78;
            color: #FFF;
            font-weight: 600;
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:hover {
            background-color: #FDFBF7;
        }
        .badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }
        .quente { background-color: #D4EDDA; color: #155724; }
        .morno { background-color: #FFF3CD; color: #856404; }
    </style>
</head>
<body>

<div class="container">
    <h2>Painel de Captura de Leads</h2>
    
    <div class="alert" style="background-color: #D4EDDA; color: #155724; border-color: #C3E6CB;">
        <strong>Conectado ao Firebase!</strong> Agora todos os leads reais que passarem pelo seu funil aparecerão aqui em tempo real.
    </div>

    <div class="controls">
        <button class="btn" onclick="exportarCSV()">📥 Exportar para Excel (CSV)</button>
        <button class="btn" style="background-color: #4CAF50;" onclick="atualizarPagina()">🔄 Atualizar Dados</button>
    </div>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Data/Hora</th>
                    <th>Nome</th>
                    <th>WhatsApp</th>
                    <th>Perfil Emocional</th>
                    <th>Perfil Pagante</th>
                    <th>Classificação</th>
                    <th>Baixou PDF?</th>
                    <th>Clicou Grupo?</th>
                    <th>Acessos Duplos</th>
                </tr>
            </thead>
            <tbody id="tabela-leads">
                <!-- Linhas inseridas via JS -->
            </tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getFirestore, collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    /* =====================================================================
     * CONFIGURAÇÃO DO FIREBASE (A MESMA QUE VOCÊ COLOCOU NO INDEX.HTML)
     * ===================================================================== */
    const firebaseConfig = {
        apiKey: "COLE_SUA_API_KEY_AQUI",
        authDomain: "COLE_SEU_AUTH_DOMAIN_AQUI",
        projectId: "COLE_SEU_PROJECT_ID_AQUI",
        storageBucket: "COLE_SEU_STORAGE_BUCKET_AQUI",
        messagingSenderId: "COLE_SEU_MESSAGING_SENDER_ID_AQUI",
        appId: "COLE_SEU_APP_ID_AQUI"
    };

    let app, db;
    let leadsData = [];

    try {
        app = initializeApp(firebaseConfig);
        db = getFirestore(app);
    } catch (e) {
        console.error("Erro no Firebase", e);
    }

    async function carregarLeadsFirebase() {
        const tbody = document.getElementById("tabela-leads");
        tbody.innerHTML = "<tr><td colspan='9' style='text-align:center; padding: 30px;'>Carregando leads do Firebase...</td></tr>";

        if (!db) {
            tbody.innerHTML = "<tr><td colspan='9' style='text-align:center; padding: 30px; color: red;'>Firebase não configurado. Cole as chaves no código.</td></tr>";
            return;
        }

        try {
            const q = query(collection(db, "leads"));
            const querySnapshot = await getDocs(q);
            
            leadsData = [];
            querySnapshot.forEach((doc) => {
                leadsData.push({ id: doc.id, ...doc.data() });
            });

            // Do mais recente para o mais antigo
            leadsData.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

            tbody.innerHTML = "";

            if (leadsData.length === 0) {
                tbody.innerHTML = "<tr><td colspan='9' style='text-align:center; padding: 30px;'>Nenhum lead encontrado no banco de dados.</td></tr>";
                return;
            }

            leadsData.forEach(lead => {
                const tr = document.createElement("tr");
                
                // Formatando a data
                let dataFormatada = "-";
                if (lead.timestamp) {
                    const dateObj = new Date(lead.timestamp);
                    dataFormatada = dateObj.toLocaleDateString("pt-BR") + " " + dateObj.toLocaleTimeString("pt-BR", {hour: '2-digit', minute:'2-digit'});
                }

                const classeBagde = lead.classificacao === "QUENTE" ? "badge quente" : (lead.classificacao === "MORNO" ? "badge morno" : "");

                tr.innerHTML = `
                    <td>${dataFormatada}</td>
                    <td><strong>${lead.name || '-'}</strong></td>
                    <td>${lead.phone || '-'}</td>
                    <td>${lead.perfil_emocional || '-'}</td>
                    <td>${lead.perfil_pagante || '-'}</td>
                    <td><span class="${classeBagde}">${lead.classificacao || '-'}</span></td>
                    <td>${lead.pdf_downloaded ? '✅ Sim' : '❌ Não'}</td>
                    <td>${lead.group_clicked ? '✅ Sim' : '❌ Não'}</td>
                    <td style="text-align:center;">${lead.duplicated_attempts || 0}</td>
                `;
                tbody.appendChild(tr);
            });
        } catch (error) {
            console.error("Erro ao buscar leads:", error);
            tbody.innerHTML = "<tr><td colspan='9' style='text-align:center; padding: 30px; color: red;'>Erro ao carregar dados. Verifique o Console.</td></tr>";
        }
    }

    window.atualizarPagina = function() {
        carregarLeadsFirebase();
    };

    window.exportarCSV = function() {
        if (leadsData.length === 0) {
            alert("Nenhum dado para exportar.");
            return;
        }

        let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; 
        csvContent += "Data/Hora;Nome;WhatsApp;Perfil Emocional;Perfil Pagante;Classificacao;Baixou PDF;Clicou no Grupo;Tentativas Duplicadas\n";

        leadsData.forEach(lead => {
            let dataFormatada = lead.timestamp ? new Date(lead.timestamp).toLocaleString("pt-BR") : "";
            
            const row = [
                dataFormatada,
                lead.name || "",
                lead.phone || "",
                lead.perfil_emocional || "",
                lead.perfil_pagante || "",
                lead.classificacao || "",
                lead.pdf_downloaded ? "Sim" : "Nao",
                lead.group_clicked ? "Sim" : "Nao",
                lead.duplicated_attempts || 0
            ].map(e => `"${String(e).replace(/"/g, '""')}"`).join(";");
            
            csvContent += row + "\n";
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "leads_projeto_memoria_firebase.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    };

    // Inicialização
    carregarLeadsFirebase();
</script>

</body>
</html>
